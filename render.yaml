# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: global-watch
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OLLAMA_FALLBACK
        value: "0"
      - key: APP_PASSWORD
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: LUMINAL_API_KEY
        sync: false
      - key: LUMINAL_TEXT_BASE_URL
        sync: false
      - key: LUMINAL_TEXT_MODEL
        sync: false

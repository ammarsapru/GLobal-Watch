<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Watch Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i></i>Global Watch</div>
    <div class="country" id="country"></div>
    <div class="status" id="status"></div>
    <div class="clock" id="clock">--:--:-- UTC</div>
    <div class="search">
      <label for="q" class="sr">Find a country</label>
      <input id="q" type="search" placeholder="Find a country…" autocomplete="off">
      <div class="results" id="results" hidden></div>
    </div>
  </header>
  <main class="main" id="main">
    <div class="col" id="left"></div>
    <div class="col center" id="center">
      <div id="newsSlot" class="slot"></div>
      <div class="stage" id="stage">
        <div class="orb" id="orb"><canvas id="globe" tabindex="0" aria-label="Globe. Hover or focus to raise it, drag or arrow keys to rotate, scroll to zoom, click a country to open its briefing."></canvas></div>
        <div class="hud">LAT <b id="lat">0.0</b> · LON <b id="lon">0.0</b> · ZOOM <b id="zoomv">1.0×</b></div>
        <div class="legend" id="legend" hidden><span><i class="dot mil"></i>Military</span><span><i class="dot civ"></i>Civil</span><span id="legendCount"></span></div>
        <div class="stage-btns"><button class="spin" id="spin" aria-pressed="true" type="button">AUTO-ROTATE</button><button class="spin" id="zoomReset" type="button">RESET VIEW</button></div>
        <div class="hint" id="hint">HOVER TO RAISE THE GLOBE</div>
        <nav class="pdock" id="pdock" aria-label="Closed panels" hidden></nav>
        <div class="tip" id="tip" hidden></div>
      </div>
    </div>
    <div class="col" id="right"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="payload.js"></script>
<script src="app.js"></script>
</body>
</html>
